<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="battle-container">
        <h1 id="status">Battle in Progress...</h1>
        <canvas id="battlefield" width="800" height="600"></canvas>
        <button id="view-history" class="btn" disabled>VIEW</button>
    </div>
    
    <script>
        const socket = io();
        const statusText = document.getElementById("status");
        const historyButton = document.getElementById("view-history");
        const canvas = document.getElementById("battlefield");
        const ctx = canvas.getContext("2d");

        socket.on("battle_end", data => {
            statusText.textContent = `Finished: ${data.result}`;
            historyButton.disabled = false;
        });

        historyButton.addEventListener('click', () => {
            socket.emit('get_history');
            historyButton.disabled = true;
        });

        socket.on('battle_history', data => {
            playHistory(data);
        });

        function playHistory(history) {
            let index = 0;

            function drawFrame() {
                if (index >= history.length) return;

                const frame = history[index];
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                frame.fighters.forEach((fighter, index) => {
                    ctx.save();
                    ctx.translate(fighter.x, fighter.y);
                    ctx.fillStyle = index === 0 ? 'blue' : 'red';
                    ctx.beginPath();
                    ctx.moveTo( 20 * Math.sin(fighter.direction), -20 * Math.cos(fighter.direction));
                    ctx.lineTo( 10 * Math.sin(4 * Math.PI / 3 + fighter.direction), -10 * Math.cos(4 * Math.PI / 3 + fighter.direction));
                    ctx.lineTo(-10 * Math.sin(4 * Math.PI / 3 - fighter.direction), -10 * Math.cos(4 * Math.PI / 3 - fighter.direction));
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                });

                frame.missiles.forEach(missile => {
                    ctx.save();
                    ctx.translate(missile.x, missile.y);

                    ctx.fillStyle = 'green';

                    ctx.beginPath();
                    ctx.moveTo( 20 * Math.sin(missile.direction), -20 * Math.cos(missile.direction));
                    ctx.lineTo( 10 * Math.sin(4 * Math.PI / 3 + missile.direction), -10 * Math.cos(4 * Math.PI / 3 + missile.direction));
                    ctx.lineTo(-10 * Math.sin(4 * Math.PI / 3 - missile.direction), -10 * Math.cos(4 * Math.PI / 3 - missile.direction));
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                });

                index++;
                setTimeout(drawFrame, 100);
            }

            drawFrame();
        }

        socket.emit('start_battle');
    </script>
</body>
</html>
