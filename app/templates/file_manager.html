<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="file-manager-container">
        <h1>Manage Your Files</h1>

        <!-- ファイル一覧 -->
        <table>
            <thead>
                <tr>
                    <th>File Name</th>
                    <th>Size (KB)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for file in files %}
                <tr>
                    <td>{{ file.name }}</td>
                    <td>{{ file.size }}</td>
                    <td>
                        <form method="POST" action="/delete-file" style="display: inline;">
                            <input type="hidden" name="file_name" value="{{ file.name }}">
                            <button type="submit" class="btn btn-delete">Delete</button>
                        </form>
                        <form method="POST" action="/edit-file" style="display: inline;">
                            <input type="hidden" name="file_name" value="{{ file.name }}">
                            <button type="submit" class="btn btn-edit">Edit</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <!-- アップロードフォーム -->
        <h2>Upload a New File</h2>
        <form method="POST" enctype="multipart/form-data" action="/upload-file">
            <input type="file" name="file" accept=".py" required>
            <button type="submit" class="btn btn-upload">Upload</button>
        </form>

        <!-- 戻るボタン -->
        <div class="back-button">
            <form method="GET" action="/home">
                <button type="submit" class="btn btn-back">Back to Home</button>
            </form>
        </div>
    </div>
</body>
</html>
